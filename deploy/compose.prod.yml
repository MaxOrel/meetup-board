# Боевой compose: образы не собираются на сервере, а приезжают готовыми из реестра.
# Что именно запустить — решает IMAGE_TAG: это хеш коммита, который собрал и проверил CI.
# Значения без ${…:?} берутся из файла .env рядом (его создаёт человек на сервере, в git его нет).
name: meetup

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meetup
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env}
      POSTGRES_DB: meetup
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetup"]
      interval: 5s
      retries: 10
    # ports нет: базу не видно ни из интернета, ни с самого сервера

  api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_REPO:?задайте IMAGE_REPO в .env}/meetup-api:${IMAGE_TAG:?нужен тег образа}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://meetup:${DB_PASSWORD}@db:5432/meetup
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в .env}
      # Первый администратор. Учебных аккаунтов на боевом сервере нет.
      ADMIN_EMAIL: ${ADMIN_EMAIL:?задайте ADMIN_EMAIL в .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD в .env}
      # Сайт открыт по HTTPS: cookie — только по защищённому каналу, запросы — только с нашего адреса
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: https://${SITE_ADDRESS:?задайте SITE_ADDRESS в .env}
      # Перед API две прокси: Caddy и nginx — настоящий адрес посетителя в X-Forwarded-For
      TRUST_PROXY: "2"
      # /api/v1/health показывает, какая версия сейчас работает
      APP_VERSION: ${IMAGE_TAG}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 5s
      retries: 20

  web:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_REPO}/meetup-web:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 5s
      retries: 10

  # Единственный, кто смотрит в интернет: принимает HTTPS, сам получает и продлевает сертификат
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # На сервере — стандартные 80 и 443. Порты переопределяются только для проверки на своём компьютере.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # здесь лежат сертификаты: потеряем — получим заново, но лимиты Let's Encrypt не бесконечны
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
