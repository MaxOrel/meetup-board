# nginx раздаёт собранный фронт и проксирует API
server {
  listen 80;
  root /usr/share/nginx/html;

  # SPA: пути вроде /events/42 или /profile на диске нет — отдаём index.html, дальше решает React Router.
  # Без этой строки обновление страницы на /profile даёт 404 от nginx.
  location / {
    try_files $uri /index.html;
  }

  # Файлы сборки с хешем в имени кешируем на год: новое содержимое — новое имя файла
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # API на том же адресе: для браузера фронт и API — один origin, CORS не нужен
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
