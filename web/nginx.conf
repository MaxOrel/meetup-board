# nginx раздаёт собранный фронт и проксирует API
server {
  listen 80;
  root /usr/share/nginx/html;

  # Заголовки безопасности для всех ответов.
  # CSP: скрипты только свои, стили и шрифты — свои и Google Fonts, запросы — только на свой origin.
  # Даже если в страницу попадёт чужой <script> или onerror, браузер его не выполнит.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # SPA: пути вроде /events/42 или /profile на диске нет — отдаём index.html, дальше решает React Router.
  # Без этой строки обновление страницы на /profile даёт 404 от nginx.
  location / {
    try_files $uri /index.html;
  }

  # Файлы сборки с хешем в имени кешируем на год: новое содержимое — новое имя файла
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # API на том же адресе: для браузера фронт и API — один origin, CORS не нужен
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
